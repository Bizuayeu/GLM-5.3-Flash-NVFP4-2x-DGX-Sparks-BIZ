[project]
name = "glm53-flash-biz-setup"
version = "1.7.1"
description = "Setup and validation tools for GLM-5.3-Flash on two DGX Spark-class systems"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["records", "state", "upstream", "dist", "overlays"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE", "PLW1510"]
